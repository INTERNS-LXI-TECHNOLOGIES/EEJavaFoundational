<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Interns Assist</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000; /* Black background */
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        .container {
            text-align: center;
            background: rgba(31, 37, 49, 0.85); /* Transparent dark background */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8); /* Increased shadow intensity */
            animation: fadeIn 2s ease-in-out; /* Removed shake */
            z-index: 2; /* Ensure it stays above the stars */
        }
        .container h1 {
            margin: 0;
            font-size: 40px; /* Increased font size */
            animation: bounceIn 1s ease-in-out, flicker 1s infinite alternate; /* Increased flicker intensity */
        }
        .container p {
            margin: 20px 0;
            font-size: 20px; /* Increased font size */
            animation: fadeIn 3s ease-in-out;
        }
        .progress-bar {
            width: 80%;
            background-color: #444b59;
            border-radius: 5px;
            margin: 20px auto;
            overflow: hidden;
        }
        .progress {
            width: 0;
            height: 20px;
            background-color: #4caf50;
            border-radius: 5px;
            animation: load 4s forwards; /* Increased speed */
        }
        .badge {
            display: inline-block;
            margin: 20px 10px;
            padding: 10px;
            background-color: #e91e63;
            color: white;
            border-radius: 50%;
            font-size: 16px; /* Increased font size */
            animation: popIn 1s ease-in-out;
        }
        a {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            animation: pulse 1s infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        @keyframes load {
            from { width: 0; }
            to { width: 100%; }
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Flicker effect for text */
        @keyframes flicker {
            0% { opacity: 1; }
            20% { opacity: 0.9; }
            40% { opacity: 0.7; }
            60% { opacity: 0.9; }
            80% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* Starfield Effect */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background: transparent;
            z-index: 1;
            animation: starfield 30s linear infinite;
            opacity: 0.7; /* Increased opacity */
            overflow: hidden;
        }

        .star {
            width: 2px;
            height: 2px;
            background: white;
            position: absolute;
            border-radius: 50%;
            animation: twinkling 5s infinite ease-in-out alternate;
        }

        .star:nth-child(odd) {
            width: 3px;
            height: 3px;
            background: #FFD700;
        }

        /* Multiple layers for thicker effect */
        .stars::before,
        .stars::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: transparent;
            z-index: 1;
            animation: starfield 60s linear infinite;
            opacity: 0.5;
            overflow: hidden;
        }

        .stars::before {
            animation-duration: 40s;
        }

        .stars::after {
            animation-duration: 20s;
        }

        @keyframes starfield {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-200%);
            }
        }

        @keyframes twinkling {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* Hide the audio element but keep it playing */
        audio {
            display: none;
        }
    </style>
    <script>
        // JavaScript to redirect after 6 seconds
        setTimeout(function() {
            window.location.href = '/home';
        }, 6000);
    </script>
</head>
<body>
    <div class="stars"></div>

    <div class="container">
        <h1>Welcome to Interns Assist</h1>
        
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
       
        <!-- Audio element for traumatic music with multiple formats -->
        <audio autoplay>
            <source src="/audio/horror-background-atmosphere-156462.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- Add more star elements dynamically -->
    <script>
        const starContainer = document.querySelector('.stars');
        for (let i = 0; i < 2000; i++) {  // Increased the count to 2000 for more stars
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.top = Math.random() * 200 + '%';
            star.style.left = Math.random() * 200 + '%';
            star.style.animationDuration = Math.random() * 3 + 2 + 's';
            starContainer.appendChild(star);
        }
    </script>
</body>
</html>
