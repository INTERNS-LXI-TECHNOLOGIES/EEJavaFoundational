<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Assign Question</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('ludo-board.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            margin: 0;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #ff4500;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin: 10px 0 5px;
        }
        input {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: calc(100% - 24px);
            font-size: 16px;
            box-sizing: border-box;
        }
        .button {
            display: inline-block;
            background-color: #32cd32;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            transition: background-color 0.3s ease;
            margin: 5px;
        }
        .button:hover {
            background-color: #228b22;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Assign Question</h2>
        <form th:action="@{/assign-question}" method="post">
            <label for="questionText">Question</label>
            <input type="text" id="questionText" name="questionText" required>
            
            <label for="correctAnswer">Correct Answer</label>
            <input type="text" id="correctAnswer" name="correctAnswer" required>
            
            <input type="submit" class="button" value="Assign Question">
        </form>
    </div>
</body>
</html>
