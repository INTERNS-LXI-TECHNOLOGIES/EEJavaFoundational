<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Player</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        body {
            font-family: 'Press Start 2P', cursive; /* Gaming-themed font */
            background-color: #282c34; /* Dark background for gaming look */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('ludo-board.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            margin: 0;
            color: #fff;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.8); /* Dark semi-transparent background */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #f39c12; /* Gold color for a more gaming feel */
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }
        .button, .signup-link {
            display: inline-block;
            background: linear-gradient(45deg, #ff6b6b, #f06595);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            text-decoration: none;
            text-shadow: 1px 1px 2px #000;
            transition: background 0.3s ease, transform 0.2s ease;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            border: 3px solid #fff; /* White border for a pixelated look */
        }
        .button:hover, .signup-link:hover {
            background: linear-gradient(45deg, #f06595, #ff6b6b);
            transform: scale(1.05);
        }
        .signup-link {
            background: linear-gradient(45deg, #1e90ff, #00bfff);
            color: white;
        }
        .signup-link:hover {
            background: linear-gradient(45deg, #00bfff, #1e90ff);
        }
        .button::before, .signup-link::before {
            content: '🎮'; /* Gaming icon */
            display: inline-block;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin" class="signup-link">Assign Role</a>
        <a href="/assignquestion" class="button">Assign Question</a>
    </div>
</body>
</html>
