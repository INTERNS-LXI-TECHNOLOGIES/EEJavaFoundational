<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Player</title>
</head>
<body>
    <h2>Add Player</h2>
    <form  th:action="@{/add}" th:object="${player}" method="post">
        <label>Name: <input type="text" th:field="*{name}" required /></label><br/>
        <button type="submit">Add Player</button>
    </form>
</body>
</html>
