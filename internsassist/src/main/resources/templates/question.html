<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ludo Game Board</title>
    <style>
        .game-board {
            display: grid;
            grid-template-columns: repeat(10, 50px); /* Adjust cell size as needed */
            grid-template-rows: repeat(10, 50px);
            gap: 1px;
        }
        .cell {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            line-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .question-link {
            font-size: 12px; /* Adjust font size as needed */
        }
    </style>
</head>
<body>
    <h1>Ludo Game Board</h1>
    <div class="game-board">
        <!-- Generate 100 cells -->
        <div th:each="cellNum : ${#numbers.sequence(1, 100)}" class="cell">
            <div th:each="questionNum : ${#numbers.sequence(1, 6)}">
                <a th:href="@{'/random-question/' + ${cellNum} + '/' + ${questionNum}}"
                   th:text="'Question ' + ${questionNum}"
                   class="question-link"></a>
            </div>
        </div>
    </div>
</body>
</html>
