<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Animation Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #ff6b6b, #f06595);
            font-family: 'Press Start 2P', cursive;
            color: #fff;
            overflow: hidden;
            text-align: center;
            cursor: pointer; /* Shows pointer cursor to indicate clickable area */
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/checkered.png');
            opacity: 0.3;
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .title {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }

        .button {
            background: #2ecc71;
            border: none;
            padding: 15px 30px;
            color: #fff;
            font-size: 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .button:hover {
            background: #27ae60;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body onclick="redirectToHome()">
    <div class="background"></div>
    <div class="container">
        <div class="title">Welcome to the Game!</div>
        <a href="home" class="button">Start Game</a>
    </div>

    <script>
        function startGame(event) {
            event.stopPropagation(); // Prevents the click event from reaching the body
            alert('Game starting soon!');
        }

        function redirectToHome() {
            window.location.href = 'home';
        }
    </script>
</body>
</html>
