<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Snake and Ladder Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 50px);
            grid-template-rows: repeat(10, 50px);
            gap: 2px;
            border: 2px solid #333;
        }
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background-color: #b3cde0;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="board">
        <div th:each="cell, iterStat : ${cells}" class="cell">
            <a th:href="@{/cell-details(cellNumber=${cell.number})}" th:text="${iterStat.index + 1}"></a>
        </div>
    </div>
</body>
</html>
