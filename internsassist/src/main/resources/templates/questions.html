<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Questions for Cell</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 70%;
            max-width: 800px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }
        h2 {
            margin-top: 0;
            font-size: 1.5em;
            color: #333;
        }
        p {
            font-size: 1em;
            margin: 10px 0;
            color: #555;
        }
        .answer-form {
            margin-top: 20px;
        }
        input[type="text"], input[type="submit"] {
            font-size: 1em;
            padding: 10px;
            margin: 5px 0;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
            color: #f00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Question</h2>
        <p th:text="${question.text}"></p>
        <form class="answer-form" th:action="@{/checkAnswer}" method="post">
            <input type="hidden" name="correctAnswer" th:value="${question.correctAnswer}">
            <input type="hidden" name="cellNumber" th:value="${cellNumber}">
            <input type="text" name="userAnswer" placeholder="Your Answer" required>
            <input type="submit" value="Submit Answer">
        </form>
        <div class="result" th:if="${result}" th:text="${result}"></div>
    </div>
</body>
</html>
