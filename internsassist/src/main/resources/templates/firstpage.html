<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Animation Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            font-family: 'Press Start 2P', cursive;
            color: #fff;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/abstract-light.png');
            opacity: 0.4;
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            z-index: 1;
        }

        .title {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #f0db4f;
            animation: pulse 1s infinite;
            text-shadow: 2px 2px 4px #000;
        }

        .button {
            background: #ff6b6b;
            border: none;
            padding: 15px 30px;
            color: #fff;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-shadow: 1px 1px 2px #000;
        }

        .button:hover {
            background: #f06595;
            transform: scale(1.1);
        }

        .animation-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            z-index: 0;
        }

        .square {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #d7e209;
            opacity: 0.6;
            animation: move 5s infinite;
        }

        .square:nth-child(1) { animation-delay: 0s; }
        .square:nth-child(2) { animation-delay: 1s; }
        .square:nth-child(3) { animation-delay: 2s; }
        .square:nth-child(4) { animation-delay: 3s; }
        .square:nth-child(5) { animation-delay: 4s; }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes move {
            0% { transform: translate(0, 0); }
            25% { transform: translate(160px, 0); }
            50% { transform: translate(160px, 160px); }
            75% { transform: translate(0, 160px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body onclick="redirectToHome()">
    <div class="background"></div>
    <div class="container">
        <div class="title">Welcome to the LXI!</div>
        <a href="home" class="button" onclick="startGame(event)">Play Now</a>
    </div>
    <div class="animation-container">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
    </div>

    <script>
        function startGame(event) {
            event.stopPropagation(); // Prevents the click event from reaching the body
            alert('Get ready to play!');
        }

        function redirectToHome() {
            window.location.href = 'home';
        }
    </script>
</body>
</htmL>
