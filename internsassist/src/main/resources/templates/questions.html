<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Questions for Cell</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 70%;
            max-width: 800px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }
        h2 {
            margin-top: 0;
            font-size: 1.5em;
            color: #333;
        }
        p {
            font-size: 1em;
            margin: 10px 0;
            color: #555;
        }
        .answer-form {
            margin-top: 20px;
        }
        input[type="text"], input[type="submit"] {
            font-size: 1em;
            padding: 10px;
            margin: 5px 0;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
            color: #f00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Question for Cell <span th:text="${cellNumber}"></span></h2>
        <p>Cell Number: <span th:text="${cellNumber}"></span></p>

        <form class="answer-form" th:action="@{/checkAnswer}" method="post">
            <div th:each="question, iter : ${questions}">
                <p th:text="${iter.index + 1} + '. ' + ${question.text}"></p>
                <input type="text" name="userAnswers" placeholder="Your Answer" required>
                <input type="hidden" name="correctAnswers" th:value="${question.correctAnswer}" />
            </div>
            <input type="submit" value="Submit Answer">
        </form>

        <p class="result" th:text="${result}" th:if="${result}"></p>
    </div>
</body>
</html>
