<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Game Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #e8e8ef;
            color: #f0f0f0;
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ffcc00;
            text-shadow: 2px 2px #000000;
            text-align: center;
        }

        .cell-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .cell {
            width: 80px;
            height: 80px;
            background-color: #e3e3e8;
            border: 2px solid #ffcc00;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffcc00;
            font-size: 1.5em;
            transition: transform 0.2s ease, background-color 0.2s ease;
            position: relative;
        }

        .cell:hover {
            transform: scale(1.1);
            background-color: #ffd633;
            color: #0d0d2b;
        }

        .cell span {
            text-shadow: 1px 1px #000000;
        }

        .question-container {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #e1e1ea;
            padding: 10px;
            border: 2px solid #ffcc00;
            width: 200px;
            z-index: 10;
        }

        .cell:hover .question-container {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Game Page</h1>
    <div class="cell-container">
          <div th:each="cell : ${cells}" class="cell">
            <span th:text="${cell.name}"></span>
            <div class="question-container">
                <div th:each="question : ${cell.questions}">
                    <p th:if="${question.trueFalseQuestion}" th:text="${question.trueFalseQuestion}"></p>
                    <p th:if="${question.optionsQuestion}" th:text="${question.optionsQuestion}"></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
