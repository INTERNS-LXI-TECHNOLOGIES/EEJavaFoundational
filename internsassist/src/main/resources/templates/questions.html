<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Question for Cell</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(135deg, #ff5f6d, #ffc371);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            padding: 30px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            font-size: 2em;
            color: #ffeb3b;
            border-bottom: 3px solid #ffeb3b;
            padding-bottom: 10px;
        }
        p {
            font-size: 1.2em;
            margin: 15px 0;
            color: #ffeb3b;
        }
        .answer-form {
            margin-top: 20px;
        }
        .answer-group {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            font-size: 1.2em;
            padding: 10px;
            margin-right: 10px;
            border: 2px solid #ffeb3b;
            border-radius: 8px;
            background: #333;
            color: #fff;
            flex-grow: 1;
        }
        input[type="submit"] {
            font-size: 1.2em;
            padding: 10px 20px;
            background-color: #ffeb3b;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        input[type="submit"]:hover {
            background-color: #ffd700;
            transform: scale(1.05);
        }
        .emoji {
            font-size: 1.5em;
            margin-left: 10px;
        }
        @font-face {
            font-family: 'Press Start 2P';
            src: url('https://fonts.gstatic.com/s/pressstart2p/v9/e3t4euGcTc3bjGM8AUChkIiHR3kYhVAnMtyo3LWOe5U.woff2') format('woff2');
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Questions for Cell <span th:text="${cellNumber}"></span></h2>
        <form class="answer-form" th:action="@{/checkAnswer}" method="post">
            <div class="question-section">
                <h3>One-Word Question</h3>
                <p th:text="${oneWordQuestion.text}"></p>
                <div class="answer-group">
                    <input type="text" name="userAnswerOneWord" placeholder="Your Answer" required>
                </div>
            </div>

            <div class="question-section">
                <h3>True/False Question</h3>
                <p th:text="${trueFalseQuestion.questionText}"></p>
                <div class="answer-group">
                    <input type="radio" name="userAnswerTrueFalse" value="true" required> True
                    <input type="radio" name="userAnswerTrueFalse" value="false" required> False
                </div>
            </div>

            <input type="submit" value="Submit Answer">
        </form>
    </div>
</body>

</html>
