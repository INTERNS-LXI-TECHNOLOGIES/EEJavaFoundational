<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Contacts</title>
</head>
<body>
    <h2>Contact List</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="contact : ${contacts}">
                <td th:text="${contact.name}"></td>
                <td th:text="${contact.email}"></td>
                <td th:text="${contact.phone}"></td>
                <td>
                    <a th:href="@{'/update-contact?id=' + ${contact.id}}">Update</a> |
                    <a th:href="@{'/delete-contact?id=' + ${contact.id}}">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/home}">Back to Home</a>
</body>
</html>
