<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bungee+Inline&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');

        body {
            background: url('welcome.jpg');
            background-color: #0d0d2b;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Caveat', cursive; /* Updated font */
        }

        h1 {
            font-size: 4em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ffcc00, #ff33cc, #33ccff, #ff6699);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px #000000;
            animation: fadeInOut 5s linear infinite; /* Added fadeInOut animation */
        }

        h2 {
            font-size: 2.5em;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #33ccff, #ff6699, #ffcc00, #ff33cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px #000000;
            animation: fadeInOut 5s linear infinite; /* Added fadeInOut animation */
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
        }

        a {
            color: #0d0d2b;
            background-color: #ffcc00;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.5em;
            border-radius: 10px;
            box-shadow: 0 4px #999;
            transition: all 0.2s ease;
            font-family: 'Press Start 2P', cursive;
        }

        a:hover {
            background-color: #ffd633;
            box-shadow: 0 6px #666;
        }

        a:active {
            background-color: #ffcc00;
            box-shadow: 0 2px #666;
            transform: translateY(4px);
        }
        
    </style>
 <audio id="background-music" autoplay loop>
    <source src="/bgm.mp3" type="audio/mp3">
    Your browser does not support the audio element.
</audio>
<script>
    document.getElementById('background-music').volume = 1; // Set volume to 50%
</script>

    <!-- Redirect to login page after 3.5 seconds -->
    <script type="text/javascript">
        setTimeout(function(){
            window.location.href = '/login';
        }, 9000);
    </script>

</head>
<body>
    <h1>Welcome to the Journey</h1>
    <h2>Get Started</h2>
</body>
</html>
