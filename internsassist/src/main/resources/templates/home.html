<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Player</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('ludo-board.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            margin: 0;
            overflow: hidden;
            animation: backgroundAnimation 15s infinite alternate;
        }
        @keyframes backgroundAnimation {
            0% {
                background-color: #1e1e1e;
                filter: brightness(1);
            }
            100% {
                background-color: #333;
                filter: brightness(0.8);
            }
        }
        .container {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.7));
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            transform: scale(0.8);
            animation: fadeInZoom 1s forwards, bounce 2s 1s;
            border: 3px solid #ff5722;
            position: relative;
            overflow: hidden;
        }
        @keyframes fadeInZoom {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }
        @keyframes lightBeam {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        @keyframes colorChange {
            0% {
                background-color: #ff5722;
            }
            50% {
                background-color: #ff9800;
            }
            100% {
                background-color: #ff5722;
            }
        }
        h2 {
            color: #ff5722;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        label {
            font-weight: bold;
            color: #fff;
            display: block;
            margin: 10px 0 5px;
            font-size: 18px;
        }
        input {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #ccc;
            width: calc(100% - 28px);
            font-size: 18px;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.6);
        }
        input:focus {
            background-color: #e0f7fa;
            border-color: #00796b;
            outline: none;
        }
        .button {
            display: inline-block;
            background-color: #ff5722;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.3s ease;
            animation: blink 1s infinite, colorChange 3s infinite alternate;
        }
        @keyframes blink {
            0% {
                border-color: #ff5722;
            }
            50% {
                border-color: #ff9800;
            }
            100% {
                border-color: #ff5722;
            }
        }
        .button:hover {
            background-color: #e64a19;
            transform: scale(1.05);
        }
        .button:active {
            background-color: #d84315;
            transform: scale(0.95);
        }
        .light-beam {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            opacity: 0.6;
            animation: lightBeam 5s infinite linear;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="light-beam"></div>
        <h2>Player Name</h2>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:value="${player.user.userName}" readonly>
        </div>
        <h3><a id="redirectButton" class="button">Let's Go</a></h3>
    </div>

    <script>
        // Function to redirect after a delay
        function redirectToNextPage() {
            setTimeout(() => {
                window.location.href = '/add';
            }, 3000); // 3-second delay before redirect
        }

        // Call the redirect function when the page is loaded
        window.onload = redirectToNextPage;
    </script>
</body>
</html>
