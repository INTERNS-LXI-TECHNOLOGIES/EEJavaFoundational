<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Multiple Choice Question</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add Java Multiple Choice Question</h1>
        <form th:action="@{/addMultipleChoice}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label for="question">Question:</label>
            <textarea id="question" name="question" rows="4" required></textarea>
            
            <label for="option1">Option 1:</label>
            <input type="text" id="option1" name="option1" required>
            
            <label for="option2">Option 2:</label>
            <input type="text" id="option2" name="option2" required>
            
            <label for="option3">Option 3:</label>
            <input type="text" id="option3" name="option3" required>
            
            <label for="option4">Option 4:</label>
            <input type="text" id="option4" name="option4" required>
            
            <label for="answer">Correct Option (1-4):</label>
            <input type="text" id="answer" name="answer" required pattern="[1-4]">

            <label for="level">Select Level:</label>
            <select id="level" name="level" required>
                <option value="" disabled selected>Select Level</option>
                <option value="1">Level 1</option>
                <option value="2">Level 2</option>
                <option value="3">Level 3</option>
                <option value="4">Level 4</option>
                <option value="5">Level 5</option>
                <option value="6">Level 6</option>
                <option value="7">Level 7</option>
                <option value="8">Level 8</option>
                <option value="9">Level 9</option>
                <option value="10">Level 10</option>
            </select>
            
            <button type="submit">Add Question</button>
        </form>
    </div>
</body>
</html>
