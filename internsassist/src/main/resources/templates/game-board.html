<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ludo Game Board</title>
    <style>
        .game-board {
            display: grid;
            grid-template-columns: repeat(10, 50px); /* Adjust cell size as needed */
            grid-template-rows: repeat(10, 50px);
            gap: 1px;
        }
        .cell {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            line-height: 50px;
        }
    </style>
</head>
<body>
    <h1>Ludo Game Board</h1>
    <div class="game-board">
        <!-- Generate 100 cells -->
        <div th:each="cellNum : ${#numbers.sequence(1, 100)}" class="cell" th:text="${cellNum}"></div>
    </div>
</body>
</html>
