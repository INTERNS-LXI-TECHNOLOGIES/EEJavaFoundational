<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        /* Style the cells */
        .cell {
            padding: 20px;
            margin: 10px;
            background-color: lightblue;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>Select a Cell</h1>
    <div class="container">
        <!-- Render cells with links -->
        <div th:each="cell : ${cells}" class="cell" 
             th:text="${cell.name}" 
             th:onclick="'window.location.href=\'/questions?cellId=' + ${cell.id} + '\';'">
        </div>
    </div>
</body>
</html>
