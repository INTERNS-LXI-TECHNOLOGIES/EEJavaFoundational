<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Assign Question</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        body {
            font-family: 'Press Start 2P', cursive; /* Gaming-themed font */
            background-color: #282c34; /* Dark background for gaming look */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('ludo-board.jpg'); /* Add a Ludo board background image */
            background-size: cover;
            background-repeat: no-repeat;
            margin: 0;
            color: #fff;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.7); /* Dark semi-transparent background */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            max-width: 400px;
            width: 100%;
            text-align: center;
            margin: 15px;
        }

        h2 {
            color: #f39c12; /* Bright gold color for the title */
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            text-shadow: 2px 2px 4px #000; /* Shadow for a glowing effect */
        }

        label {
            font-weight: bold;
            color: #fff;
            display: block;
            margin: 10px 0 5px;
        }

        input[type="text"] {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: calc(100% - 24px);
            font-size: 16px;
            box-sizing: border-box;
            background-color: #333; /* Dark background for input fields */
            color: #fff; /* White text */
        }

        .button {
            background-color: #32cd32; /* Ludo green color */
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-shadow: 1px 1px 2px #000; /* Shadow for text */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* Shadow effect */
            border: 3px solid #fff; /* White border for pixelated look */
        }

        .button:hover {
            background-color: #228b22;
            transform: scale(1.05);
        }

        .radio-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .radio-container div {
            margin: 5px;
        }

        .radio-container input[type="radio"] {
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <form th:action="@{/assign-question}" method="post">
        <label for="questionText">Question</label>
        <input type="text" id="questionText" name="questionText" required>

        <label for="questionType">Question Type</label>
        <select id="questionType" name="questionType" required>
            <option value="true_false">True/False</option>
            <option value="multiple_choice">Multiple Choice</option>
            <option value="one_word">One Word</option>
        </select>

        <div id="trueFalseSection" style="display: none;">
            <label for="isTrue">Is True</label>
            <select id="isTrue" name="isTrue">
                <option value="true">True</option>
                <option value="false">False</option>
            </select>
        </div>

        <div id="multipleChoiceSection" style="display: none;">
            <label for="options">Options (comma separated)</label>
            <input type="text" id="options" name="options">
        </div>

        <div id="commonSection" style="display: none;">
            <label for="correctAnswer">Correct Answer</label>
            <input type="text" id="correctAnswer" name="correctAnswer">
        </div>

        <input type="submit" class="button" value="Assign Question">
    </form>

    <script>
        document.getElementById('questionType').addEventListener('change', function () {
            var type = this.value;
            document.getElementById('trueFalseSection').style.display = type === 'true_false' ? 'block' : 'none';
            document.getElementById('multipleChoiceSection').style.display = type === 'multiple_choice' ? 'block' : 'none';
            document.getElementById('commonSection').style.display = type !== 'true_false' ? 'block' : 'none';
        });
    </script>
</body>
</html>
