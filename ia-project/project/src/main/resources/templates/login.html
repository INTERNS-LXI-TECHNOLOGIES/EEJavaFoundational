<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body {
            background: url('peakpx.jpg') ;
            font-family: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        /* Style the container */
        .container {
            position: relative;
            border-radius: 5px;
            background-color: rgba(246, 245, 252, 0.8);      
                  padding: 30px 0;
            width: 600px; /* Decreased the width */
            height: auto; /* Increased the height */
            margin: auto; /* Center the container */
            margin-top: 50px;
        } 

        /* Style inputs and link buttons */
        input,
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            margin: 5px 0;
            opacity: 0.85;
            display: inline-block;
            font-size: 17px;
            line-height: 20px;
            text-decoration: none; /* remove underline from anchors */
        }

        input:hover,
        .btn:hover {
            opacity: 1;
        }

        /* Add appropriate colors to fb, twitter, and google buttons */
        .fb {
            background-color: #3B5998;
            color: white;
        }

        .twitter {
            background-color: #55ACEE;
            color: white;
        }

        .google {
            background-color: #dd4b39;
            color: white;
        }

        /* Style the submit button */
        input[type=submit] {
            background-color: #04AA6D;
            color: white;
            cursor: pointer;
        }

        input[type=submit]:hover {
            background-color: #45a049;
        }

        /* Two-column layout */
        .col {
            float: left;
            width: 50%;
            margin: auto;
            padding: 0 50px;
            margin-top: 6px;
        }

        /* Clear floats after the columns */
        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        /* Vertical line */
        .vl {
            position: absolute;
            left: 50%;
            transform: translate(-50%);
            border: 2px solid #ddd;
            height: 175px;
        }

        /* Text inside the vertical line */
        .vl-innertext {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            background-color: #f1f1f1;
            border: 1px solid #ccc;
            border-radius: 50%;
            padding: 8px 10px;
        }

        /* Hide some text on medium and large screens */
        .hide-md-lg {
            display: none;
        }

        /* Bottom container for "Forgot password?" and "Sign up" */
        .bottom-container {
            width: 600px; /* Match container width */
            text-align: center;
            background-color: #666;
            border-radius: 0px 0px 4px 4px;
            margin: auto;
            margin-top: 10px;
            padding: 10px 0;
        }

        .bottom-container a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            display: inline-block;
            border-radius: 4px;
        }

        /* Responsive layout - when the screen is less than 650px wide, make the two columns stack on top of each other instead of next to each other */
        @media screen and (max-width: 650px) {
            .col {
                width: 100%;
                margin-top: 0;
            }
            /* Hide the vertical line */
            .vl {
                display: none;
            }
            /* Show the hidden text on small screens */
            .hide-md-lg {
                display: block;
                text-align: center;
            }
            /* Adjust bottom container width */
            .bottom-container {
                width: 100%;
            }
        }
    </style>
     <audio id="background-music" autoplay loop>
        <source src="/bgm.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
    <script>
        document.getElementById('background-music').volume = 1; // Set volume to 50%
    </script>

</head>
<body>

<div class="container">
    <form th:action="@{/login}" method="post">
         <div class="row">
            <h2 style="text-align:center">Login with Social Media or Manually</h2>
            <div class="vl">
                <span class="vl-innertext">or</span>
            </div>

            <div class="col">
                <a href="#" class="fb btn">
                    <i class="fa fa-facebook fa-fw"></i> Login with Facebook
                </a>
                <a href="#" class="twitter btn">
                    <i class="fa fa-twitter fa-fw"></i> Login with Twitter
                </a>
                <a href="#" class="google btn">
                    <i class="fa fa-google fa-fw"></i> Login with Google+
                </a>
            </div>

            <div class="col">
                <div class="hide-md-lg">
                    <p>Or sign in manually:</p>
                </div>

                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="submit" value="Login">
            </div>
        </div>
    </form>
</div>

<div class="bottom-container">
    <a href="#">Forgot password?</a>
    <a href="#">Sign up</a>
</div>

</body>
</html>
