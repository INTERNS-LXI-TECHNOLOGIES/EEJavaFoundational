<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000; /* Black background */
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        .container {
            text-align: center;
            background: rgba(31, 37, 49, 0.85); /* Transparent dark background */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8); /* Increased shadow intensity */
            animation: fadeIn 2s ease-in-out;
            z-index: 2; /* Ensure it stays above the particles */
        }
        .container h1 {
            margin: 0;
            font-size: 2.5em; /* Increased font size */
            color: #ff6f61; /* Bright color for title */
            animation: bounceIn 1s ease-in-out, flicker 1s infinite alternate;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-size: 1.2em;
            margin-bottom: 5px;
            color: #ff6f61; /* Red color for labels */
        }
        input {
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        button {
            background-color: #ff6f61; /* Red button color */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background-color: #e55e5e; /* Darker red on hover */
            transform: scale(1.05);
        }
        a {
            display: block;
            margin-top: 20px;
            color: #ff6f61; /* Red color for links */
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        a:hover {
            color: #e55e5e; /* Darker red on hover */
            text-shadow: 0 0 3px rgba(255, 105, 97, 0.5); /* Reduced shadow */
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        @keyframes flicker {
            0% { opacity: 1; }
            20% { opacity: 0.9; }
            40% { opacity: 0.7; }
            60% { opacity: 0.9; }
            80% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1; /* Behind the container */
        }
        .star {
            position: absolute;
            width: 8px; /* Increased size */
            height: 8px; /* Increased size */
            background-color: rgba(255, 255, 255, 0.8); /* Brighter color */
            border-radius: 50%;
            opacity: 0.9; /* Slightly more visible */
            animation: fall 2s linear infinite; /* Faster falling speed */
        }
        @keyframes fall {
            0% {
                transform: translateY(-100vh);
                opacity: 0.9;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="stars">
        <!-- Multiple stars for the effect -->
        <div class="star" style="left: 10%; animation-duration: 2s;"></div>
        <div class="star" style="left: 20%; animation-duration: 2.5s;"></div>
        <div class="star" style="left: 30%; animation-duration: 3s;"></div>
        <div class="star" style="left: 40%; animation-duration: 2s;"></div>
        <div class="star" style="left: 50%; animation-duration: 3s;"></div>
        <div class="star" style="left: 60%; animation-duration: 2.5s;"></div>
        <div class="star" style="left: 70%; animation-duration: 3s;"></div>
        <div class="star" style="left: 80%; animation-duration: 2s;"></div>
        <div class="star" style="left: 90%; animation-duration: 3.5s;"></div>
    </div>
    <div class="container">
        <h1>Signup</h1>
        <form th:action="@{/signup}" method="post">
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div>
                <button type="submit">Signup</button>
            </div>
        </form>
        <a th:href="@{/login}">Login</a>
    </div>
</body>
</html>
